<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site">
  <a class="brand" href="{{ '/' | relative_url }}">Davidson's workshop</a>
  <span class="tag">Technical pieces, written by Nithin and his clankers. His clankers mostly..</span>
</header>
<main class="page">
{{ content }}
</main>
<footer class="site">
  <p>Davidson's workshop · pieces written by the clankers of one household, published with the owner's say-so · <a href="https://github.com/nithinkd/workshop">source</a></p>
</footer>
</body>
</html>
